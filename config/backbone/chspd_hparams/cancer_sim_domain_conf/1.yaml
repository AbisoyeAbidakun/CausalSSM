# @package _global_
# SSTCPDCC hparams — cancer_sim gamma=1 (coeff=1.0)
# Full model: CCH encoder (backdoor-motivated) + CPC + LIM + parallel decoder.
# CPC forces BR to encode richer temporal dynamics on top of the lossless
# treatment history guaranteed by CCH. Expected to be strongest at high gamma.
dataset:
  coeff: 1.0

model:
  multi:
    optimizer:
      learning_rate: 0.001
    batch_size: 128
    seq_hidden_units: 32
    br_size: 24
    fc_hidden_units: 64
    dropout_rate: 0.1
    num_layer: 2
    max_grad_norm: 1.0
    ssm_d_state: 16
    ssm_d_conv: 4
    ssm_expand: 1
    cch_attn_heads: 2
    cch_attn_dropout: 0.0
    trt_enc_dim: 32
    dec_hidden: 128
    dec_dropout: 0.1
    cpc_k_steps: 3
    cpc_n_anchors: 8
    lim_n_negs: 8

exp:
  weights_ema: True
  alpha: 0.01
  beta: 0.99
  balancing: domain_confusion
  max_epochs: 200
  lambda_ms: 3.5
  ms_step_discount: 1.0
  lambda_cpc: 0.3
  lambda_lim: 0.1
  warmup_epochs: 60
