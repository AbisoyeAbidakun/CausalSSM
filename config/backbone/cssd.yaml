# @package _global_
#
# SSTD — Selective-State-Space Causal Transformer + Direct Parallel Decoder
#
# Extends sst.yaml with ParallelMultiStepDecoder configuration.
#
# What changes vs sst.yaml:
#   • _target_ → src.models.cssd.CSSD
#   • Three decoder architecture knobs:
#       trt_enc_dim : per-step treatment embedding width (TreatmentMLP output)
#       dec_hidden  : shared trunk hidden width
#       dec_dropout : trunk dropout rate
#   • Two training loss knobs in exp:
#       lambda_ms        : multi-step loss weight (parallel decoder can handle
#                          higher lambda than GRU — no teacher-forcing gap)
#       ms_step_discount : per-step horizon discount γ (1.0 = no discount)
#
# Fill missing hyperparameters via command line, tune_hparams=True,
# or +backbone/sstd_hparams=<dataset>/<split>.
#
# Quick run example:
#   python3 runnables/train_multi.py +backbone=sstd \
#       "+backbone/sstd_hparams/cancer_sim_domain_conf='1'" \
#       +dataset=cancer_sim exp.seed=10

model:
  name: CSSD
  multi:
    _target_: src.models.cssd.CSSD
    max_seq_length: ${sum:${dataset.max_seq_length},${dataset.projection_horizon}}

    # ── Core dimensions (same knobs as SST / CT) ─────────────────────────────
    seq_hidden_units:              # d_model — SSM hidden width
    br_size:                       # balanced representation output size
    fc_hidden_units:               # outcome / treatment head inner width
    dropout_rate:
    num_layer: 2
    max_grad_norm:
    batch_size:

    # ── SSM-specific hyperparameters (inherited from SST) ─────────────────────
    ssm_d_state: 16
    ssm_d_conv: 4
    ssm_expand: 1

    # ── ParallelMultiStepDecoder architecture ─────────────────────────────────
    trt_enc_dim: 32   # treatment embedding width — match br_size for equal
                      # treatment-vs-state expressiveness; 32 is a good default
    dec_hidden: 128   # trunk hidden width; 128 ≈ 4–5× br_size is a safe ratio
    dec_dropout: 0.1

    # ── CT/EDCT parent-chain stubs (required by inherited _init_specific) ─────
    # See sst.yaml for explanation.  Values are the same as SST stubs.
    num_heads: 2
    attn_dropout: False
    disable_cross_attention: False
    isolate_subnetwork: _
    self_positional_encoding:
      absolute: False
      trainable: True
      max_relative_position: 15

    # ── Augmentation ─────────────────────────────────────────────────────────
    augment_with_masked_vitals: True

    # ── Optimiser ────────────────────────────────────────────────────────────
    optimizer:
      optimizer_cls: adam
      learning_rate:
      weight_decay: 0.0
      lr_scheduler: False

    tune_hparams: False
    tune_range: 50
    hparams_grid:
    resources_per_trial:

exp:
  weights_ema: True
  balancing: domain_confusion
  alpha: 0.01
  beta: 0.99

  # ── Parallel decoder loss ─────────────────────────────────────────────────
  # lambda_ms can be set higher than for GRU-based decoders because:
  #   a) No train/inference gap (zero teacher-forcing issue)
  #   b) Near-zero head initialisation (prevents large early gradients)
  #   c) br_last is detached — encoder is protected from decoder loss
  # Calibrated from CMCPD R1: 3.5 works well; try 2.0 if factual RMSE regresses.
  lambda_ms: 3.5

  # ms_step_discount < 1.0 down-weights far horizons during training.
  # 1.0 = uniform; 0.9 = 10% decay per step; recommended: keep at 1.0 unless
  # the 5-6 step predictions are clearly under-trained.
  ms_step_discount: 1.0
