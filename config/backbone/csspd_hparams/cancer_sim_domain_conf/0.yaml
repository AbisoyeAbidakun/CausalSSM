# @package _global_
# SSTCPD hparams — cancer_sim gamma=0 (coeff=0.0)
# Encoder + decoder dimensions match SSTD gamma=0 for ablation consistency.
# CPC/LIM settings follow the gamma=1 baseline.
dataset:
  coeff: 0.0

model:
  multi:
    optimizer:
      learning_rate: 0.001
    batch_size: 128
    seq_hidden_units: 32
    br_size: 24
    fc_hidden_units: 64
    dropout_rate: 0.1
    num_layer: 2
    max_grad_norm: 1.0
    ssm_d_state: 16
    ssm_d_conv: 4
    ssm_expand: 1
    trt_enc_dim: 32
    dec_hidden: 128
    dec_dropout: 0.1
    cpc_k_steps: 3
    cpc_n_anchors: 8
    lim_n_negs: 8

exp:
  weights_ema: True
  alpha: 0.01
  beta: 0.99
  balancing: domain_confusion
  max_epochs: 200
  lambda_ms: 3.5
  ms_step_discount: 1.0
  lambda_cpc: 0.3
  lambda_lim: 0.1
  warmup_epochs: 60
