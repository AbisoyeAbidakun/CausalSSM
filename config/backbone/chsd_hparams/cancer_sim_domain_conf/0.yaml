# @package _global_
# SSTDCC hparams — cancer_sim gamma=0 (coeff=0.0)
# CausallyConstrainedHybridBlock: treatment=attention O(T²), outcome/vitals=SSM O(T).
# num_layer=2 (single-layer CCH blocks, same depth as SSTD num_layer=2).
# Theoretical guarantee: full A_{1:t} encoding via attention satisfies the
# backdoor adjustment criterion — critical at higher gamma where confounding is strong.
dataset:
  coeff: 0.0

model:
  multi:
    optimizer:
      learning_rate: 0.001
    batch_size: 128
    seq_hidden_units: 32
    br_size: 24
    fc_hidden_units: 64
    dropout_rate: 0.1
    num_layer: 2
    max_grad_norm: 1.0
    ssm_d_state: 16
    ssm_d_conv: 4
    ssm_expand: 1
    cch_attn_heads: 2
    cch_attn_dropout: 0.0
    trt_enc_dim: 32
    dec_hidden: 128
    dec_dropout: 0.1

exp:
  weights_ema: True
  alpha: 0.01
  beta: 0.99
  balancing: domain_confusion
  max_epochs: 200
  lambda_ms: 3.5
  ms_step_discount: 1.0
